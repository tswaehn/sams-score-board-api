document:
  name: API 2.0 historical mirror
  updated: 2026-08-07
  purpose: Two-stage API that serves SAMS data from a local SQLite mirror.

architecture:
  stage_1_sync:
    owner: upstream_sync.HistoricalSync
    order:
      - fetch and persist all seasons
      - process seasons from newest to oldest by start date
      - for each season, fetch and persist competitions using the season query parameter
      - for each season, fetch and persist leagues using the season query parameter
      - propagate the refreshed local season currentSeason flag to each imported competition and league
      - for every referenced association or attached team, fetch it only when absent locally
      - for each imported competition, sync match groups, their matches, embedded match results, and per-match-group rankings
      - for each imported league, sync match days, their matches, embedded match results, and league-wide rankings
    refresh_behavior:
      default: Existing competition and league UUIDs are always refreshed after their season lists are read.
      force: Calling sync_once(force=True) performs the same full refresh.
    cadence: HISTORICAL_SYNC_INTERVAL_SECONDS (default: 86400)
    rule: Public API request handlers never enqueue or make upstream REST requests.
  upstream_transport:
    owner: upstream_queue.UpstreamQueue
    rule: The process has exactly one queue and one worker for all upstream calls.
    properties:
      - FIFO within each priority level
      - serial requests
      - configured inter-request pacing
      - pagination also uses the same queue
      - page size is 100, the maximum documented by SAMS REST API v2.1
      - upstream HTTP request timeout is 10 seconds
  related_entity_reuse:
    - seasons are refreshed before child-entity imports and resolved locally while importing them
    - an already stored team is reused rather than refetched
    - an already stored association is reused rather than refetched
    - stored competition/team and league/team links are reused rather than refetching entity team lists
  stage_2_read_api:
    owner: server.py
    source: SQLite only
    behavior: Returns 404 for records that have not yet been imported rather than falling back to SAMS.

storage:
  engine: SQLite
  default_path: data/sams-database
  journal_mode: WAL
  performance:
    - NORMAL synchronous mode balances durability and bulk-insert performance
    - temporary tables and intermediate operations use memory
    - a 64 MiB SQLite page cache is held in process memory per connection
    - seasons are written in one short transaction; competitions and leagues commit in batches of 25 entities
  tables:
    - seasons
    - associations
    - teams
    - competitions
    - leagues
    - competition_teams
    - league_teams
    - match_groups
    - competition_matches
    - competition_match_results
    - competition_match_group_rankings
    - league_match_days
    - league_matches
    - league_match_results
    - league_rankings
  internal_logging:
    path: data/internal.log
    upstream_request_times:
      fields:
        - full request URL
        - duration_ms
      severity:
        under_or_equal_to_5_seconds: info
        over_5_seconds: error
        failed_request: error
        timeout_attempt: error
  upstream_request_cache:
    path: data/sams-request-cache.sqlite3
    format: SQLite
    table: upstream_requests
    fields:
      - url
      - request
      - response
      - logged_at
      - last_access
    read_behavior: Historical sync returns the newest exact-URL cache entry before enqueuing an upstream request and records its last_access timestamp.
  payload_policy: Store normalized lookup columns and the upstream JSON payload enriched with currentSeason for competitions and leagues.
  latest_upstream_update:
    columns:
      - competitions.latest_upstream_update
      - leagues.latest_upstream_update
    value: Later timestamp of latestResultUpdate and latestStructuralUpdate from the upstream payload.

environment:
  SERVER_CONFIG_PATH:
    required: true_for_startup
    default: config/server_config.json
    purpose: Path to the JSON runtime configuration.
configuration:
  template: config/server_config_template.json
  required_keys:
    - ssvb_api_url
    - ssvb_api_key
  optional_keys:
    - host
    - port
    - log_level
    - database_path
    - upstream_min_delay_seconds
    - upstream_max_retries
    - historical_sync_interval_seconds

routes:
  - GET /api/healthz
  - GET /api/seasons
  - GET /api/competition-list?season_id=<uuid>
  - GET /api/league-list?season_id=<uuid>
  - GET /api/competition/<uuid>
  - GET /api/league/<uuid>
